name: AYAtlas Constitutional CI & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    name: Build & Verify AYAtlas Architecture Platform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build All Monorepo Packages
        run: npm run build:all

      - name: Run Vitest Unit Test Suite
        run: npm test

      - name: Run 5-Gate Constitutional CI Enforcer
        run: npx ayatlas-verify --sha d8018a2c3b4a5e6f7a8b9c0d1e2f3a4b5c6d7e8f
